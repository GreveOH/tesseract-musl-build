name: Build Tesseract with musl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: alpine:edge

    steps:
      - name: Install build dependencies
        run: |
          apk update
          apk add --no-cache \
            bash \
            build-base \
            autoconf \
            automake \
            libtool \
            git \
            pkgconfig \
            xz \
            zlib-dev \
            libjpeg-turbo-dev \
            libpng-dev \
            tiff-dev \
            zlib-dev \
            clang \
            clang-dev \
            cmake \
            ca-certificates \
            curl \
            nasm \
            gcc \
            g++ \
            icu-dev \
            libwebp-dev \
            libxml2-dev \
            python3 \
            py3-pip \
            gettext-dev \
            lcms2-dev

      - name: Build and install Leptonica
        run: |
          git clone --branch 1.83.0 https://github.com/DanBloomberg/leptonica.git
          cd leptonica
          ./autobuild
          ./configure --prefix=/usr --disable-programs
          make -j$(nproc)
          make install

      - name: Build and install Tesseract
        run: |
          git clone --branch 5.3.4 https://github.com/tesseract-ocr/tesseract.git
          cd tesseract
          ./autogen.sh
          ./configure --prefix=/usr --enable-static=yes --enable-shared=no
          make -j$(nproc)
          make install

      - name: Archive compiled binaries
        run: |
          mkdir -p /artifacts/bin /artifacts/lib
          cp /usr/bin/tesseract /artifacts/bin/
          cp /usr/lib/*.a /artifacts/lib/
          cp -r /usr/include /artifacts/include

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-musl-build
          path: /artifacts

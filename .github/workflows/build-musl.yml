name: Build Tesseract for musl (Alpine)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest

    steps:
      - name: Install build dependencies
        run: |
          apk update
          apk add --no-cache \
            build-base \
            clang \
            cmake \
            autoconf \
            automake \
            libtool \
            git \
            pkgconfig \
            zlib-dev \
            jpeg-dev \
            libpng-dev \
            tiff-dev \
            wget \
            curl \
            xz \
            bash

      - name: Clone Leptonica
        run: |
          git clone --branch 1.83.0 https://github.com/DanBloomberg/leptonica.git
          cd leptonica
          ./autogen.sh
          ./configure --prefix=/usr
          make -j$(nproc)
          make install

      - name: Clone Tesseract
        run: |
          git clone https://github.com/tesseract-ocr/tesseract.git
          cd tesseract
          git checkout 5.3.1
          ./autogen.sh
          ./configure --prefix=/usr --with-extra-libraries=/usr/lib --with-extra-includes=/usr/include
          make -j$(nproc)
          make install

      - name: Package binaries
        run: |
          mkdir -p /output/bin
          cp /usr/bin/tesseract /output/bin/
          cp -r /usr/lib /output/lib
          cp -r /usr/share/tessdata /output/tessdata || echo "No tessdata found"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-musl-binaries
          path: /output
